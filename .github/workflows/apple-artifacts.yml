name: Build Apple Artifacts

on:
  workflow_dispatch:
    inputs:
      ios_export_method:
        description: Export method used for the iOS IPA artifact.
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
          - enterprise
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  APP_NAME: CineFlow
  BUILD_CONFIGURATION: Release
  PRODUCT_BUNDLE_IDENTIFIER: com.sanlorng.CineFlow
  PROJECT_PATH: CineFlow.xcodeproj
  SCHEME: CineFlow

jobs:
  build-macos:
    name: Build macOS app and DMG
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Trust package plugins and macros for CI
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Prepare local-only build inputs
        env:
          DANDAN_APP_ID_VALUE: ${{ secrets.DANDAN_APP_ID }}
          DANDAN_APP_SECRET_VALUE: ${{ secrets.DANDAN_APP_SECRET }}
        run: |
          mkdir -p SharedApp
          cat > SharedApp/secrets.env <<EOF
          DANDAN_APP_ID=${DANDAN_APP_ID_VALUE}
          DANDAN_APP_SECRET=${DANDAN_APP_SECRET_VALUE}
          EOF

      - name: Install Apple signing assets
        if: ${{ env.APPLE_TEAM_ID != '' && env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' }}
        run: bash .github/scripts/install-apple-signing-assets.sh

      - name: Archive macOS app
        env:
          MACOS_SIGNING_ENABLED: ${{ env.APPLE_TEAM_ID != '' && env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/${APP_NAME}-macOS.xcarchive"
          args=(
            archive
            -project "$PROJECT_PATH"
            -scheme "$SCHEME"
            -configuration "$BUILD_CONFIGURATION"
            -destination "generic/platform=macOS"
            -archivePath "$ARCHIVE_PATH"
            -skipPackagePluginValidation
            -skipMacroValidation
          )

          if [[ "${MACOS_SIGNING_ENABLED}" == "true" ]]; then
            args+=(
              "DEVELOPMENT_TEAM=${APPLE_TEAM_ID}"
              "CODE_SIGN_STYLE=Manual"
              "CODE_SIGN_IDENTITY=Developer ID Application"
            )

            if [[ -n "${MACOS_PROFILE_NAME:-}" ]]; then
              args+=("PROVISIONING_PROFILE_SPECIFIER=${MACOS_PROFILE_NAME}")
            fi
          else
            args+=(
              "CODE_SIGNING_ALLOWED=NO"
              "CODE_SIGNING_REQUIRED=NO"
            )
          fi

          xcodebuild "${args[@]}"
          echo "MACOS_ARCHIVE_PATH=${ARCHIVE_PATH}" >> "$GITHUB_ENV"

      - name: Package macOS artifacts
        env:
          MACOS_CODESIGN_IDENTITY: ${{ env.APPLE_TEAM_ID != '' && env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && 'Developer ID Application' || '' }}
        run: |
          set -euo pipefail

          APP_PATH="${MACOS_ARCHIVE_PATH}/Products/Applications/${APP_NAME}.app"
          mkdir -p build

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "build/${APP_NAME}-macOS-app.zip"
          bash .github/scripts/create-dmg.sh "$APP_PATH" "build/${APP_NAME}-macOS.dmg" "$APP_NAME"

      - uses: actions/upload-artifact@v6
        with:
          name: CineFlow-macOS
          path: |
            build/CineFlow-macOS-app.zip
            build/CineFlow-macOS.dmg
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Trust package plugins and macros for CI
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Prepare local-only build inputs
        env:
          DANDAN_APP_ID_VALUE: ${{ secrets.DANDAN_APP_ID }}
          DANDAN_APP_SECRET_VALUE: ${{ secrets.DANDAN_APP_SECRET }}
        run: |
          mkdir -p SharedApp
          cat > SharedApp/secrets.env <<EOF
          DANDAN_APP_ID=${DANDAN_APP_ID_VALUE}
          DANDAN_APP_SECRET=${DANDAN_APP_SECRET_VALUE}
          EOF

      - name: Check iOS signing prerequisites
        id: ios_prereqs
        run: |
          set -euo pipefail

          if [[ -n "${APPLE_TEAM_ID}" && -n "${IOS_CERTIFICATE_P12_BASE64}" && -n "${IOS_CERTIFICATE_PASSWORD}" && -n "${IOS_PROVISIONING_PROFILE_BASE64}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping iOS packaging because signing secrets are incomplete."
          fi

      - name: Install Apple signing assets
        if: ${{ steps.ios_prereqs.outputs.enabled == 'true' }}
        run: bash .github/scripts/install-apple-signing-assets.sh

      - name: Generate export options
        if: ${{ steps.ios_prereqs.outputs.enabled == 'true' }}
        env:
          IOS_EXPORT_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_export_method || 'ad-hoc' }}
          PRODUCT_BUNDLE_IDENTIFIER: ${{ env.PRODUCT_BUNDLE_IDENTIFIER }}
        run: |
          set -euo pipefail
          mkdir -p build
          bash .github/scripts/generate-export-options.sh "build/ExportOptions.plist"

      - name: Archive iOS app
        if: ${{ steps.ios_prereqs.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/${APP_NAME}-iOS.xcarchive"
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            "DEVELOPMENT_TEAM=${APPLE_TEAM_ID}" \
            "CODE_SIGN_STYLE=Manual" \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=${IOS_PROFILE_NAME}"

          echo "IOS_ARCHIVE_PATH=${ARCHIVE_PATH}" >> "$GITHUB_ENV"

      - name: Export IPA
        if: ${{ steps.ios_prereqs.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail

          EXPORT_PATH="build/ios-export"
          xcodebuild -exportArchive \
            -archivePath "$IOS_ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "build/ExportOptions.plist"

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          mv "$IPA_PATH" "build/${APP_NAME}-iOS.ipa"

      - uses: actions/upload-artifact@v6
        if: ${{ steps.ios_prereqs.outputs.enabled == 'true' }}
        with:
          name: CineFlow-iOS
          path: build/CineFlow-iOS.ipa
          if-no-files-found: error
